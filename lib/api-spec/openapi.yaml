openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Veriscope API — documents, risks, evidence, assessments, mitigation actions
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Source business documents
  - name: risks
    description: Identified risks with evidence, actions and assessment history
  - name: dashboard
    description: Aggregates for the overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/status:
    get:
      operationId: getSystemStatus
      tags: [health]
      summary: Live status of API, database and AI provider configuration
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents, newest first
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add a document from plain text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A document with identical text already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDocumentError"
  /documents/upload:
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a PDF, DOCX or TXT file and extract its text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "201":
          description: Created with extracted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "400":
          description: Missing file or invalid title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A document with identical text already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDocumentError"
        "413":
          description: File or extracted text too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: File is corrupted, empty or has no extractable text (e.g. scanned PDF)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{id}/analyze:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: analyzeDocument
      tags: [documents]
      summary: Start AI risk analysis of the document's text (runs in the background; poll the document for status)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "202":
          description: Analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already analyzing, or already analyzed and replaceExisting was not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document including its full text
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document and everything derived from it
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risks:
    get:
      operationId: listRisks
      tags: [risks]
      summary: List risks with optional filters
      parameters:
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RiskSeverity"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RiskStatus"
        - name: documentId
          in: query
          required: false
          schema:
            type: integer
        - name: evidenceStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EvidenceStatus"
        - name: reviewRequired
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Risks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Risk"
  /risks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getRisk
      tags: [risks]
      summary: Risk with evidence, mitigation actions and assessment history
      responses:
        "200":
          description: Risk detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risks/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createAction
      tags: [actions]
      summary: Create a mitigation action for a risk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MitigationAction"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Risk not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /actions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateAction
      tags: [actions]
      summary: Update a mitigation action. Never changes the risk's status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MitigationAction"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAction
      tags: [actions]
      summary: Delete a mitigation action
      responses:
        "204":
          description: Deleted
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risks/{id}/reassessments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: requestReassessment
      tags: [reassessment]
      summary: Reassess a risk against new evidence (file, pasted text, or an existing document). Runs in the background; never changes the risk's status.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReassessmentInput"
      responses:
        "202":
          description: Reassessment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassessmentRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Risk, action or document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A reassessment is already running for this risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Evidence too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Evidence could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assessments/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: decideAssessment
      tags: [reassessment]
      summary: Record a human decision (accept or reject) on an AI reassessment recommendation. Does not change the risk's status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentDecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not a reassessment, or already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risks/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: changeRiskStatus
      tags: [risks]
      summary: Change a risk's status with a recorded reason. Closing requires a named approver and a justification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskStatusChangeInput"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskStatusChange"
        "400":
          description: Invalid input, or closing without approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Risk or assessment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Status unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Portfolio-level counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent events across documents, risks and assessments
      responses:
        "200":
          description: Activity, newest first (max 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SystemStatus:
      type: object
      required: [api, database, aiProvider, checkedAt]
      properties:
        api:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok, error]
        aiProvider:
          type: string
          enum: [configured, not_configured]
        checkedAt:
          type: string
          format: date-time
    DuplicateDocumentError:
      type: object
      required: [error, existingDocumentId]
      properties:
        error:
          type: string
        existingDocumentId:
          type: integer
    DocumentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        title:
          type: string
          maxLength: 200
    AnalyzeRequest:
      type: object
      properties:
        rerun:
          type: boolean
          description: Re-run analysis on an already analyzed document. Findings are matched to existing risks (which keep their IDs and gain a new assessment); nothing is deleted.
    AnalysisRunStatus:
      type: string
      enum: [running, completed, failed]
    AnalysisRun:
      type: object
      required: [id, documentId, status, model, chunksTotal, risksIdentified, risksNew, risksMatched, risksNotDetected, error, startedAt, finishedAt]
      properties:
        id:
          type: integer
        documentId:
          type: integer
        status:
          $ref: "#/components/schemas/AnalysisRunStatus"
        model:
          type: string
        chunksTotal:
          type: integer
        risksIdentified:
          type: ["integer", "null"]
        risksNew:
          type: ["integer", "null"]
          description: Findings that did not match an existing risk
        risksMatched:
          type: ["integer", "null"]
          description: Findings matched to an existing risk (same ID kept)
        risksNotDetected:
          type: ["integer", "null"]
          description: Existing risks this run did not find again (kept, flagged for review)
        error:
          type: ["string", "null"]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
    DocumentSource:
      type: string
      enum: [text, pdf, docx]
    DocumentStatus:
      type: string
      enum: [uploaded, analyzing, analyzed, failed]
    Document:
      type: object
      required:
        [id, title, filename, charCount, sourceType, purpose, fileSize, pageCount, status, analysisError, analysisModel, chunksTotal, chunksDone, analysisStartedAt, analyzedAt, riskCount, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        filename:
          type: ["string", "null"]
        purpose:
          type: string
          enum: [analysis, evidence]
          description: evidence = submitted as follow-up evidence for a reassessment
        charCount:
          type: integer
        sourceType:
          $ref: "#/components/schemas/DocumentSource"
        fileSize:
          type: ["integer", "null"]
          description: Original file size in bytes (null for pasted text)
        pageCount:
          type: ["integer", "null"]
          description: Number of pages (PDF only)
        status:
          $ref: "#/components/schemas/DocumentStatus"
        analysisError:
          type: ["string", "null"]
          description: Why the last analysis failed
        analysisModel:
          type: ["string", "null"]
        chunksTotal:
          type: ["integer", "null"]
          description: Number of text sections sent to the AI in the current/last analysis
        chunksDone:
          type: ["integer", "null"]
        analysisStartedAt:
          type: ["string", "null"]
          format: date-time
        analyzedAt:
          type: ["string", "null"]
          format: date-time
        riskCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          required: [content, pageOffsets, analysisRuns]
          properties:
            analysisRuns:
              type: array
              description: Analysis runs, newest first
              items:
                $ref: "#/components/schemas/AnalysisRun"
            content:
              type: string
            pageOffsets:
              type: ["array", "null"]
              description: Character offset where each PDF page starts (index 0 = page 1)
              items:
                type: integer
    DocumentInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        filename:
          type: string
    RiskSeverity:
      type: string
      enum: [low, medium, high, critical]
    RiskStatus:
      type: string
      enum: [open, mitigating, closed]
      description: closed is only set through an explicit human approval
    RiskLikelihood:
      type: string
      enum: [low, medium, high]
    EvidenceBasis:
      type: string
      enum: [direct, inferred, none]
      description: direct = supported by quotation; inferred = interpretation of several passages; none = no quotable support
    EvidenceStatus:
      type: string
      enum: [verified, partially_verified, unverified, no_evidence]
      description: Computed by the server from verification against the source text
    EvidenceMatchType:
      type: string
      enum: [exact, normalized, not_found]
    Risk:
      type: object
      required:
        [id, documentId, documentTitle, title, description, category, severity, likelihood, businessImpact, reviewNotes, recommendedMitigation, evidenceBasis, interpretationNote, evidenceStatus, reviewRequired, reviewReasons, status, evidenceCount, verifiedEvidenceCount, openActionCount, lastAssessedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        documentId:
          type: integer
        documentTitle:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        severity:
          $ref: "#/components/schemas/RiskSeverity"
        likelihood:
          oneOf:
            - $ref: "#/components/schemas/RiskLikelihood"
            - type: "null"
        businessImpact:
          type: ["string", "null"]
        reviewNotes:
          type: ["string", "null"]
          description: Uncertainty or points a human reviewer should check
        recommendedMitigation:
          type: ["string", "null"]
          description: Latest AI-recommended mitigation
        evidenceBasis:
          oneOf:
            - $ref: "#/components/schemas/EvidenceBasis"
            - type: "null"
        interpretationNote:
          type: ["string", "null"]
          description: Why the risk is an interpretation of several passages rather than a direct quotation
        evidenceStatus:
          $ref: "#/components/schemas/EvidenceStatus"
        reviewRequired:
          type: boolean
        reviewReasons:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/RiskStatus"
        evidenceCount:
          type: integer
          description: Quotations in the current evidence set
        verifiedEvidenceCount:
          type: integer
        lastAssessedAt:
          type: ["string", "null"]
          format: date-time
        openActionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Evidence:
      type: object
      description: A verbatim quote from a source document, located by character offsets
      required: [id, riskId, documentId, documentTitle, assessmentId, quote, claimedQuote, matchType, normalizations, matchCount, startOffset, endOffset, pageNumber, verified, createdAt]
      properties:
        id:
          type: integer
        riskId:
          type: integer
        documentId:
          type: integer
        documentTitle:
          type: string
        assessmentId:
          type: ["integer", "null"]
        quote:
          type: string
          description: Exact source characters when verified; otherwise the unverified claimed text
        claimedQuote:
          type: ["string", "null"]
          description: The quotation exactly as the AI returned it
        matchType:
          $ref: "#/components/schemas/EvidenceMatchType"
        normalizations:
          type: array
          description: Normalizations needed to locate a "normalized" match (e.g. whitespace, quotes, dashes)
          items:
            type: string
        matchCount:
          type: integer
          description: Number of places the quotation occurs in the document; more than 1 means the location is ambiguous
        startOffset:
          type: ["integer", "null"]
        endOffset:
          type: ["integer", "null"]
        pageNumber:
          type: ["integer", "null"]
          description: 1-based PDF page containing the quote, when known
        verified:
          type: boolean
          description: True only if the quote was found verbatim in the source document text
        createdAt:
          type: string
          format: date-time
    ActionStatus:
      type: string
      enum: [open, in_progress, submitted_for_review]
    ActionInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 3
          maxLength: 2000
        owner:
          type: ["string", "null"]
          maxLength: 200
        dueDate:
          type: ["string", "null"]
          description: Calendar date, YYYY-MM-DD
        status:
          $ref: "#/components/schemas/ActionStatus"
        evidenceNote:
          type: ["string", "null"]
          maxLength: 4000
        evidenceDocumentId:
          type: ["integer", "null"]
    ActionUpdate:
      type: object
      properties:
        description:
          type: string
          minLength: 3
          maxLength: 2000
        owner:
          type: ["string", "null"]
          maxLength: 200
        dueDate:
          type: ["string", "null"]
          description: Calendar date, YYYY-MM-DD
        status:
          $ref: "#/components/schemas/ActionStatus"
        evidenceNote:
          type: ["string", "null"]
          maxLength: 4000
        evidenceDocumentId:
          type: ["integer", "null"]
    MitigationAction:
      type: object
      required: [id, riskId, description, owner, dueDate, status, evidenceNote, evidenceDocumentId, evidenceDocumentTitle, createdAt, updatedAt]
      properties:
        id:
          type: integer
        riskId:
          type: integer
        description:
          type: string
        owner:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
          description: Calendar date, YYYY-MM-DD
        status:
          $ref: "#/components/schemas/ActionStatus"
        evidenceNote:
          type: ["string", "null"]
          description: Supporting evidence described by the owner
        evidenceDocumentId:
          type: ["integer", "null"]
        evidenceDocumentTitle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssessmentVerdict:
      type: string
      enum: [identified, not_detected, resolved, partially_resolved, unresolved, needs_human_review]
      description: identified/not_detected come from document analysis; the others are reassessment outcomes (AI recommendations)
    ReassessmentOutcome:
      type: string
      enum: [resolved, partially_resolved, unresolved, needs_human_review]
    EvidenceType:
      type: string
      enum: [operating_evidence, policy_or_design, plan_or_promise, unrelated, mixed]
      description: Only operating_evidence (proof a control is working) can support resolution
    HumanDecision:
      type: string
      enum: [accepted, rejected]
    ReassessmentInput:
      type: object
      description: Provide exactly one of file, content, or documentId
      properties:
        file:
          type: string
          format: binary
        content:
          type: string
          description: Pasted follow-up evidence text
        title:
          type: string
          maxLength: 200
        documentId:
          type: integer
          description: Use an existing document as the evidence
        actionId:
          type: integer
          description: Mitigation action the evidence relates to (defaults to the most recently updated action)
    ReassessmentRequestStatus:
      type: string
      enum: [pending, completed, failed]
    ReassessmentRequest:
      type: object
      required: [id, riskId, actionId, evidenceDocumentId, evidenceDocumentTitle, status, error, assessmentId, model, createdAt, finishedAt]
      properties:
        id:
          type: integer
        riskId:
          type: integer
        actionId:
          type: ["integer", "null"]
        evidenceDocumentId:
          type: integer
        evidenceDocumentTitle:
          type: string
        status:
          $ref: "#/components/schemas/ReassessmentRequestStatus"
        error:
          type: ["string", "null"]
        assessmentId:
          type: ["integer", "null"]
        model:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
    AssessmentDecisionInput:
      type: object
      required: [decision, decidedBy]
      properties:
        decision:
          $ref: "#/components/schemas/HumanDecision"
        decidedBy:
          type: string
          minLength: 2
          maxLength: 200
        note:
          type: ["string", "null"]
          maxLength: 2000
    RiskStatusChangeInput:
      type: object
      required: [status, changedBy]
      properties:
        status:
          $ref: "#/components/schemas/RiskStatus"
        changedBy:
          type: string
          minLength: 2
          maxLength: 200
        note:
          type: ["string", "null"]
          maxLength: 2000
          description: Required (min 10 characters) when closing
        assessmentId:
          type: ["integer", "null"]
          description: Reassessment this decision is based on
        approveClosure:
          type: boolean
          description: Must be true to close the risk (explicit human approval)
    RiskStatusChange:
      type: object
      required: [id, riskId, fromStatus, toStatus, changedBy, note, assessmentId, createdAt]
      properties:
        id:
          type: integer
        riskId:
          type: integer
        fromStatus:
          $ref: "#/components/schemas/RiskStatus"
        toStatus:
          $ref: "#/components/schemas/RiskStatus"
        changedBy:
          type: string
        note:
          type: ["string", "null"]
        assessmentId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
    Assessment:
      type: object
      required: [id, riskId, kind, verdict, rationale, confidence, evidenceDocumentId, evidenceDocumentTitle, model, analysisRunId, severity, likelihood, evidenceBasis, evidence, actionId, aiVerdict, evidenceType, requirementsMet, remainingGaps, nextSteps, guardrailNotes, decision, decidedBy, decisionNote, decidedAt, createdAt]
      properties:
        id:
          type: integer
        riskId:
          type: integer
        kind:
          type: string
          enum: [initial, reanalysis, reassessment]
        verdict:
          $ref: "#/components/schemas/AssessmentVerdict"
        rationale:
          type: string
        confidence:
          type: ["number", "null"]
        evidenceDocumentId:
          type: ["integer", "null"]
        model:
          type: ["string", "null"]
        analysisRunId:
          type: ["integer", "null"]
        severity:
          oneOf:
            - $ref: "#/components/schemas/RiskSeverity"
            - type: "null"
        likelihood:
          oneOf:
            - $ref: "#/components/schemas/RiskLikelihood"
            - type: "null"
        evidenceBasis:
          oneOf:
            - $ref: "#/components/schemas/EvidenceBasis"
            - type: "null"
        evidence:
          type: array
          description: Quotations cited by this assessment
          items:
            $ref: "#/components/schemas/Evidence"
        evidenceDocumentTitle:
          type: ["string", "null"]
        actionId:
          type: ["integer", "null"]
          description: Reassessment only - the mitigation action evaluated
        aiVerdict:
          description: Reassessment only - the AI's outcome before server rules were applied
          oneOf:
            - $ref: "#/components/schemas/ReassessmentOutcome"
            - type: "null"
        evidenceType:
          oneOf:
            - $ref: "#/components/schemas/EvidenceType"
            - type: "null"
        requirementsMet:
          type: ["array", "null"]
          items:
            type: string
        remainingGaps:
          type: ["array", "null"]
          items:
            type: string
        nextSteps:
          type: ["array", "null"]
          items:
            type: string
        guardrailNotes:
          type: ["array", "null"]
          description: Why the server changed the AI's outcome
          items:
            type: string
        decision:
          oneOf:
            - $ref: "#/components/schemas/HumanDecision"
            - type: "null"
        decidedBy:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    RiskDetail:
      allOf:
        - $ref: "#/components/schemas/Risk"
        - type: object
          required: [evidence, actions, assessments, sourceDocument, reassessmentRequests, statusChanges]
          properties:
            reassessmentRequests:
              description: Newest first
              type: array
              items:
                $ref: "#/components/schemas/ReassessmentRequest"
            statusChanges:
              description: Newest first
              type: array
              items:
                $ref: "#/components/schemas/RiskStatusChange"
            sourceDocument:
              $ref: "#/components/schemas/Document"
            evidence:
              description: Current evidence (from the latest assessment that identified the risk)
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
            actions:
              type: array
              items:
                $ref: "#/components/schemas/MitigationAction"
            assessments:
              type: array
              items:
                $ref: "#/components/schemas/Assessment"
    SeverityCounts:
      type: object
      required: [low, medium, high, critical]
      properties:
        low:
          type: integer
        medium:
          type: integer
        high:
          type: integer
        critical:
          type: integer
    StatusCounts:
      type: object
      required: [open, mitigating, closed]
      properties:
        open:
          type: integer
        mitigating:
          type: integer
        closed:
          type: integer
    DashboardSummary:
      type: object
      required:
        [totalDocuments, totalRisks, risksBySeverity, risksByStatus, openActions, totalEvidence, verifiedEvidence, totalAssessments, risksRequiringReview]
      properties:
        totalDocuments:
          type: integer
        totalRisks:
          type: integer
        risksBySeverity:
          $ref: "#/components/schemas/SeverityCounts"
        risksByStatus:
          $ref: "#/components/schemas/StatusCounts"
        openActions:
          type: integer
        totalEvidence:
          type: integer
        verifiedEvidence:
          type: integer
        totalAssessments:
          type: integer
        risksRequiringReview:
          type: integer
    ActivityItem:
      type: object
      required: [id, type, message, createdAt, documentId, riskId]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [document_added, risk_identified, assessment_recorded]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        documentId:
          type: ["integer", "null"]
        riskId:
          type: ["integer", "null"]
